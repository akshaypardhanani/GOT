[project]
name = "got"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dynamic-yaml>=2.0.0",
    "jpeg4py>=0.1.4",
    "matplotlib>=3.10.9",
    "opencv-python>=5.0.0.93",
    "scipy>=1.15.3",
    "setuptools<82",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "visdom>=0.2.4",
    "depth-anything-3",
]


[tool.uv]
no-build-isolation-package = ["visdom"]
exclude-dependencies = [
    { package = { name = "depth-anything-3" }, dependencies = ["numpy"] },
    { package = { name = "depth-anything-3" }, dependencies = ["xformers"] },
    { package = { name = "depth-anything-3" }, dependencies = ["torch"] },
]


[tool.uv.sources]
depth-anything-3 = { path = "pytracking/ltr/Depth-Anything-3", editable = true }